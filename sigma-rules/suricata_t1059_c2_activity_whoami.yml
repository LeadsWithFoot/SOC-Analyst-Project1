title: Suricata C2 Activity Command Detected (whoami)
id: 3f9c7e11-2cdd-4a88-8495-775a4cb77f32
status: stable
description: Detects the command with the intention of executing "whoami" command via HTTP, indicating potential Command and Control activity.
author: Troy Williams
logsource:
  product: suricata
  service: eve
  category: network_traffic
detection:
  selection:
    event_type: "alert"
    alert.signature: "C2 Activity - whoami in HTTP body"
  condition: selection
fields:
  - @timestamp
  - src_ip
  - dest_ip
  - alert.signature
  - http.http_response_body_printable
  - flow.bytes_toserver
  - flow.bytes_toclient
  - host.name
level: high
tags:
  - attack.execution
  - attack.t1059
  - attack.command_and_scripting_interpreter
  - suricata
  - c2
  - whoami
metadata:
  tactic: execution
  technique: Command_and_Scripting_Interpreter
  technique_id: T1059
  confidence: high
  vendor: Suricata
  created: 2025-07-16
  author: Troy Williams
falsepositives:
  - Web services echoing user commands
  - Misconfigured debug or test endpoints
references:
  - https://attack.mitre.org/techniques/T1059/
